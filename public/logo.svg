<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Foxquart">
  <title>Foxquart</title>
  <rect width="512" height="512" rx="122" fill="#1E2128" />
  <!--
    Fox head: two ear points sweeping down into a shield that tapers to a rounded
    chin, with a Q counter cut out of the muzzle. Counter and tail stroke are
    punched with even-odd fill so the mark stays one path and recolours cleanly.
  -->
  <g transform="translate(256 256) scale(0.952) translate(-256 -294)">
  <path
    fill="#FF5A0F"
    fill-rule="evenodd"
    d="M97 84 L256 216 L415 84
       C415 84 413 246 404 318
       C396 382 380 424 356 456
       C332 488 292 504 256 504
       C220 504 180 488 156 456
       C132 424 116 382 108 318
       C99 246 97 84 97 84 Z
       M256 262
       C205 262 180 300 180 344
       C180 388 205 426 256 426
       C275 426 291 420 303 410
       L284 389 L311 366 L332 390
       C339 376 343 361 343 344
       C343 300 307 262 256 262 Z"
  />
  </g>
</svg>
